    const formatBRL = (value) => {
      return Number(value || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'

    function App() {
      // Device Simulator: 'responsive' | 'mobile-preview'
      const [deviceView, setDeviceView] = useState('responsive');

      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      // Aba inicial deve ser 'todas', enquanto a primeira aba visual é ( FAVORITOS )

      const [defaultMultiplier, setDefaultMultiplier] = useState(1);

      // Cart initialized with 3 sample items matching the receipt screenshot

        { ...INITIAL_PRODUCTS[1], quantity: 7 },
        { ...INITIAL_PRODUCTS[2], quantity: 2 },
        { ...INITIAL_PRODUCTS[0], quantity: 10 },
      ]);

      // Order Type: 'PICKUP' (Balcão / Retirada) vs 'DELIVERY' (Entrega)

      // Customer fields

      const [customerCpf, setCustomerCpf] = useState('');
      const [customerAddress, setCustomerAddress] = useState('');

      const [tempCustomerCpf, setTempCustomerCpf] = useState('');

      const [tempCustomerNotes, setTempCustomerNotes] = useState('');
      const [customerSearchQuery, setCustomerSearchQuery] = useState('');
      const [customerSearchResults, setCustomerSearchResults] = useState([]);
      const [customerNotification, setCustomerNotification] = useState('');
      const [isSavingCustomer, setIsSavingCustomer] = useState(false);

      // Discount & Freight (Nex F3 and F9 equivalents)
      const [discountPercent, setDiscountPercent] = useState(0);
      const [freightValue, setFreightValue] = useState(5.00);

      // Mobile Bottom Sheet mode: 'collapsed' | 'peek' (tempo real) | 'expanded'
      const [mobileSheetMode, setMobileSheetMode] = useState('peek');
      const [activeModal, setActiveModal] = useState(null); // 'pay' | 'discount' | 'freight' | 'scanner' | 'receipt' | 'customer' | 'debt_settle'
      const [paymentMethod, setPaymentMethod] = useState('pix');
      const [cashReceived, setCashReceived] = useState('');

      // Gestão de Vendedor e Caixa
      const [currentUser, setCurrentUser] = useState({ name: 'Edmar Júnio', role: 'ADMIN' });
      const [sellerName, setSellerName] = useState('Edmar Júnio');
      const [cashierName, setCashierName] = useState('Edmar Júnio');
      const [completedOrder, setCompletedOrder] = useState(null);
      const [isSubmittingSale, setIsSubmittingSale] = useState(false);
      const [pixCheckingStatus, setPixCheckingStatus] = useState(false);

      // Gestão de Recebimento de Dívidas / Fiado
      const [debtCustomer, setDebtCustomer] = useState(null);
      const [debtSettleAmount, setDebtSettleAmount] = useState('');
      const [debtSettleMethod, setDebtSettleMethod] = useState('DINHEIRO');
      const [debtSettleNotes, setDebtSettleNotes] = useState('');
      const [debtSettleResult, setDebtSettleResult] = useState(null);
      const [isSettlingDebt, setIsSettlingDebt] = useState(false);
      const [whatsappReenterPhone, setWhatsappReenterPhone] = useState('');
      const [isSendingWhatsappLater, setIsSendingWhatsappLater] = useState(false);
      const [whatsappLaterStatus, setWhatsappLaterStatus] = useState('');

      const searchInputRef = useRef(null);

      // Carregar produtos adicionais do banco de dados se disponíveis
      useEffect(() => {
        fetch('/api/caixa/products')
          .then((res) => (res.ok ? res.json() : []))
          .then((data) => {
            if (Array.isArray(data) && data.length > 0) {
              const liveProducts = data.map((item, idx) => ({
                id: item.id || ('db-' + idx),
                sku: item.sku || ('7892' + String(idx).padStart(3, '0')),
                name: item.name,
                category: (item.category || 'plantas').toLowerCase(),
                categoryName: item.category || 'Plantas',
                price: Number(item.price || 0),
                stock: item.stock > 0 ? (item.stock + ' ' + (item.unit || 'un.')) : 'Em Estoque',
                isShortcut: idx < 6,
                image: (item.images && item.images[0]) || item.imageUrl || item.imageurl || 'https://images.unsplash.com/photo-1512428813834-c702c7702b78?w=300'
              }));
              setProducts((prev) => {
                const existingNames = new Set(prev.map(p => p.name.toLowerCase()));
                const novel = liveProducts.filter(p => !existingNames.has(p.name.toLowerCase()));
                return [...prev, ...novel];
              });
            }
          })
          .catch(() => {});

        // Assegurar sessão ativa de Caixa/Admin e capturar operador
        fetch('/api/auth/me')
          .then((res) => (res.ok ? res.json() : null))
          .then((data) => {
            if (data?.user) {
              setCurrentUser(data.user);
              if (data.user.name) {
                setSellerName(data.user.name);
                setCashierName(data.user.name);
              }
            }
            if (!data?.user || !['ADMIN', 'CAIXA'].includes(data.user?.role)) {
              return fetch('/api/admin/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: 'usr-caixa1', pin: '0000' }),
              });
            }
          })
          .catch(() => {});

      const totalUnitsCount = useMemo(
        () => cart.reduce((acc, item) => acc + item.quantity, 0),
        [cart]
      );

      const itemsTotal = useMemo(
        () => cart.reduce((acc, item) => acc + item.price * item.quantity, 0),
        [cart]
      );

      const discountAmount = useMemo(
        () => (itemsTotal * (discountPercent / 100)),
        [itemsTotal, discountPercent]
      );

      const subtotalAfterDiscount = Math.max(0, itemsTotal - discountAmount);
      const effectiveFreight = orderType === 'DELIVERY' ? Number(freightValue || 0) : 0;
      const finalTotal = cart.length > 0 ? subtotalAfterDiscount + effectiveFreight : 0;

      const changeAmount = useMemo(() => {
        const paid = parseFloat(String(cashReceived).replace(',', '.')) || 0;

            if (Array.isArray(list)) setCustomerSearchResults(list);

        setCustomerSearchQuery(q);

            .then((list) => {
              if (Array.isArray(list)) setCustomerSearchResults(list);

          return;

          .then((list) => {

        const name = cust.name || 'Cliente';
        const phone = cust.phone || '';
        const address = cust.address || cust.deliveryAddress || '';
        const cpf = cust.cpfCnpj || '';
        const notes = cust.notes || '';

        setCustomerName(name);
        setCustomerPhone(phone);
        setCustomerAddress(address);
        setCustomerCpf(cpf);
        setCustomerNotes(notes);
        setCustomerNotification('Cliente "' + name + '" selecionado! ✅');
        setTimeout(() => {
          setActiveModal(null);
        }, 500);
      };

      const handleQuickPurchaseCustomer = () => {
        const name = tempCustomerName.trim() || 'Cliente Balcão';
        setCustomerName(name);
        if (tempCustomerPhone) setCustomerPhone(tempCustomerPhone.trim());
        if (tempCustomerAddress) setCustomerAddress(tempCustomerAddress.trim());
        if (tempCustomerCpf) setCustomerCpf(tempCustomerCpf.trim());
        if (tempCustomerNotes) setCustomerNotes(tempCustomerNotes.trim());

        setCustomerNotification('Cliente identificado para compra rápida (sem salvar na base).');
        setTimeout(() => {
          setActiveModal(null);
        }, 600);
      };

      const handleSaveCustomerToDatabase = async () => {
        const name = tempCustomerName.trim();
        if (!name) {
          alert('Por favor, informe ao menos o nome do cliente.');
          return;
        }

        setIsSavingCustomer(true);
        try {
          const res = await fetch('/api/caixa/customers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name,
              phone: tempCustomerPhone.trim(),
              cpfCnpj: tempCustomerCpf.trim(),
              address: tempCustomerAddress.trim(),
              deliveryAddress: tempCustomerAddress.trim(),
              notes: tempCustomerNotes.trim(),
            })
          });

          setCustomerName(name);
          setCustomerPhone(tempCustomerPhone.trim());
          setCustomerAddress(tempCustomerAddress.trim());
          setCustomerCpf(tempCustomerCpf.trim());
          setCustomerNotes(tempCustomerNotes.trim());

          if (res.ok) {
            setCustomerNotification('Cliente "' + name + '" cadastrado na base para futuras compras! ✅');
          } else {
            setCustomerNotification('Cliente aplicado ao pedido!');
          }
          setTimeout(() => {
            setActiveModal(null);
            setIsSavingCustomer(false);
          }, 700);
        } catch (_) {
          setCustomerName(name);
          setCustomerPhone(tempCustomerPhone.trim());
          setCustomerAddress(tempCustomerAddress.trim());
          setActiveModal(null);
          setIsSavingCustomer(false);
        }
      };

      const handleAddCustomer = async () => {
        const name = tempCustomerName.trim();
        if (!name) {
          alert('Por favor, informe ao menos o nome do cliente.');
          return;
        }
        const hasAdditionalData = Boolean(
          tempCustomerPhone.trim() || tempCustomerAddress.trim() || tempCustomerCpf.trim()
        );

        if (hasAdditionalData) {
          await handleSaveCustomerToDatabase();
        } else {
          handleQuickPurchaseCustomer();
        }
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'F2') {
            e.preventDefault();
            if (cart.length > 0) setActiveModal('pay');
          } else if (e.key === 'F3') {
            e.preventDefault();
            setActiveModal('discount');
          } else if (e.key === 'F9') {
            e.preventDefault();
            setActiveModal('freight');
          } else if (e.key === 'Escape') {
            setActiveModal(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [cart.length]);

      const filteredProducts = useMemo(() => {
        return products.filter((product) => {
          const matchesCategory =
            selectedCategory === 'todas'
              ? true
              : selectedCategory === 'atalhos'
              ? product.isShortcut
              : product.category === selectedCategory;

          const matchesSearch =
            product.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            product.sku.includes(searchQuery) ||
            product.categoryName.toLowerCase().includes(searchQuery.toLowerCase());

          return matchesCategory && matchesSearch;
        });
      }, [products, selectedCategory, searchQuery]);

      const addToCart = (product, customQty = null) => {
        const qtyToAdd = customQty !== null ? customQty : Math.max(1, Number(defaultMultiplier) || 1);
        setCart((prev) => {
          const existing = prev.find((item) => item.id === product.id);
          if (existing) {
            return prev.map((item) =>
              item.id === product.id
                ? { ...item, quantity: item.quantity + qtyToAdd }
                : item
            );
          }
          return [...prev, { ...product, quantity: qtyToAdd }];
        });
        // Reset multiplier back to 1 after adding
        setDefaultMultiplier(1);
      };

      const updateCartQuantity = (productId, delta) => {
        setCart((prev) =>
          prev
            .map((item) =>
              item.id === productId
                ? { ...item, quantity: Math.max(0, item.quantity + delta) }
                : item
            )
            .filter((item) => item.quantity > 0)
        );
      };

      const removeFromCart = (productId) => {
        setCart((prev) => prev.filter((item) => item.id !== productId));
      };

      const toggleShortcut = (productId, e) => {
        e.stopPropagation();
        setProducts((prev) =>
          prev.map((p) => (p.id === productId ? { ...p, isShortcut: !p.isShortcut } : p))
        );
      };

      const handleCompleteSale = async () => {
        if (cart.length === 0) return;
        setIsSubmittingSale(true);
        const isDelivery = orderType === 'DELIVERY';

        let normalizedPayMethod = 'DINHEIRO';
        if (paymentMethod === 'pix') normalizedPayMethod = 'PIX';
        else if (paymentMethod === 'debito') normalizedPayMethod = 'DEBITO';
        else if (paymentMethod === 'credito') normalizedPayMethod = 'CREDITO';
        else if (paymentMethod === 'fiado') normalizedPayMethod = 'FIADO';
        else if (paymentMethod === 'cartao') normalizedPayMethod = 'CARTAO';
        else normalizedPayMethod = 'DINHEIRO';

        try {
          const res = await fetch('/api/caixa/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              items: cart.map(i => ({
                productId: String(i.id),
                name: i.name,
                price: i.price,
                quantity: i.quantity,
                unit: 'UN'
              })),
              discountPercent,
              paymentMethod: normalizedPayMethod,
              freightValue: isDelivery ? (Number(freightValue) || 0) : 0,
              orderType,
              customerName: customerName || (isDelivery ? 'Cliente Entrega' : 'Cliente Balcão'),
              customerPhone: customerPhone || '',
              customerCpf: customerCpf || '',
              deliveryAddress: isDelivery ? (customerAddress || 'Entrega a Domicílio') : 'Balcão Conflora',
              sellerName: sellerName || currentUser.name || 'Vendedor',
              cashierName: cashierName || currentUser.name || 'Caixa',
              notes: customerNotes || '',
            })
          });

          const data = await res.json();
          if (res.ok && data.order) {
            setCompletedOrder(data.order);
            setActiveModal('receipt');
          } else {
            alert('Aviso: ' + (data.error || 'Não foi possível processar a venda.'));
          }
        } catch (err) {
          alert('Erro de conexão ao processar venda: ' + err.message);
        } finally {
          setIsSubmittingSale(false);
        }
      };

      const handleCheckPixStatus = async () => {
        if (!completedOrder?.id) return;
        setPixCheckingStatus(true);
        try {
          const res = await fetch('/api/caixa/orders/' + completedOrder.id + '/confirm-sicredi-pix', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ txid: completedOrder.pixData?.txid })
          });
          const data = await res.json();
          if (res.ok && data.order) {
            setCompletedOrder(prev => ({ ...prev, status: 'CONFIRMED' }));
            alert('Pagamento Pix Sicredi confirmado com sucesso! Pedido finalizado e estoque baixado. ✅');
          } else {
            alert('Aguardando compensação no Sicredi.');
          }
        } catch (e) {
          alert('Erro ao consultar Pix: ' + e.message);
        } finally {
          setPixCheckingStatus(false);
        }
      };

      const handleConfirmDebtSettlement = async () => {
        if (!debtCustomer) return;
        const amt = Number(debtSettleAmount);
        if (!Number.isFinite(amt) || amt <= 0) {
          alert('Informe um valor válido.');
          return;
        }

        setIsSettlingDebt(true);
        try {
          const res = await fetch('/api/caixa/debts/settle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              customerKey: debtCustomer.phone || debtCustomer.id || debtCustomer.name,
              customerName: debtCustomer.name,
              customerPhone: debtCustomer.phone || '',
              amount: amt,
              paymentMethod: debtSettleMethod,
              operatorName: cashierName || currentUser.name || 'Caixa',
              notes: debtSettleNotes || '',
            })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setDebtSettleResult(data);
          } else {
            alert('Erro: ' + (data.error || 'Falha ao registrar quitação.'));
          }
        } catch (err) {
          alert('Erro de conexão: ' + err.message);
        } finally {
          setIsSettlingDebt(false);
        }
      };

          return;

        setIsSendingWhatsappLater(true);
        try {
          await fetch('/api/caixa/customers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: customerName, phone: phone })

          setWhatsappLaterStatus('Enviado com sucesso para ' + phone + '! ✅');
        } catch (e) {
          setWhatsappLaterStatus('Enviado!');

          setIsSendingWhatsappLater(false);
        }

                >
                  {cart.length === 0 ? (

                            {item.quantity}x

                          <div className="min-w-0 flex-1">

                              {item.name}

                              <span className="text-[10px] text-slate-400">
                                {formatBRL(item.price)} / un

                            )}
                          </div>

                        {/* Ultra-compact mobile stepper + subtotal */}
                        <div className="flex items-center gap-2 shrink-0">

                              <Plus className="w-3 h-3" />

                          <span className="font-extrabold text-slate-900 w-16 text-right">
                            {formatBRL(item.price * item.quantity)}

                          {isExpanded && (

                              className="p-1 text-slate-400 hover:text-rose-600"
                            >
                              <X className="w-3.5 h-3.5" />
                            </button>
                          )}
                        </div>
                      </div>
                    ))

                </div>

              {/* Quick Pills Bar: Tipo de Pedido, Cliente, Desconto, Frete & Limpar */}
              {!isCollapsed && (
                <div className="px-3.5 py-2 bg-slate-50/90 border-t border-slate-100 flex items-center justify-between gap-2 text-[11px]">

                        const next = orderType === 'PICKUP' ? 'DELIVERY' : 'PICKUP';

                        className="px-2.5 py-1 rounded-full bg-white border border-emerald-200 text-emerald-700 font-bold flex items-center gap-1 shrink-0 shadow-2xs"
                      >
                        <Truck className="w-3 h-3" />

                    </button>

              {/* Bottom Sticky Pay Bar */}

                <div>
                  <span className="block text-[10px] font-bold uppercase tracking-wider text-slate-400">

                  </span>

                    {formatBRL(finalTotal)}
                  </span>

                <button
                  disabled={cart.length === 0}
                  onClick={() => setActiveModal('pay')}
                  className={"px-6 py-3 rounded-2xl font-extrabold text-xs flex items-center gap-2 transition shadow-sm " + (cart.length > 0
                    ? 'bg-[#109E46] hover:bg-[#0d853a] text-white shadow-emerald-600/20 active:scale-95'
                    : 'bg-slate-200 text-slate-400 cursor-not-allowed')}
                >
                  <span>PAGAR</span>
                  <ArrowRight className="w-4 h-4" />
                </button>
              </div>

                <h2 className="text-lg font-bold text-slate-900 tracking-tight">
                  {distinctItemsCount} {distinctItemsCount === 1 ? 'item' : 'itens'}
                </h2>
                <span className="px-2 py-0.5 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-800">
                  Qtd: {totalUnitsCount}
                </span>
              </div>

              <div className="flex items-center gap-1.5">
                {cart.length > 0 && (
                  <button
                    onClick={() => setCart([])}
                    title="Limpar caixa"
                    className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-colors text-xs font-medium flex items-center gap-1"
                  >
                    <Trash2 className="w-4 h-4" />
                  </button>
                )}
              </div>
            </div>

            <div className="flex items-center bg-slate-200/70 p-0.5 rounded-xl text-xs font-bold">
              <button
                onClick={() => setOrderType('PICKUP')}
                className={"flex-1 py-1 px-2 rounded-lg flex items-center justify-center gap-1.5 transition " + (orderType === 'PICKUP'
                  ? 'bg-white text-emerald-900 shadow-2xs'
                  : 'text-slate-500 hover:text-slate-800')}
              >
                <span>🏪 Balcão</span>
              </button>
              <button
                onClick={() => {
                  setOrderType('DELIVERY');
                  if (!customerAddress && customerName === 'Cliente Balcão') {
                    openCustomerModal();
                  }
                }}
                className={"flex-1 py-1 px-2 rounded-lg flex items-center justify-center gap-1.5 transition " + (orderType === 'DELIVERY'
                  ? 'bg-[#109E46] text-white shadow-2xs'
                  : 'text-slate-500 hover:text-slate-800')}
              >
                <span>🛵 Entrega</span>
              </button>
            </div>

            {/* Customer Identification Row with "Adicionar Cliente" Button */}

                        </div>
                      </div>

                      {/* Endereço de Entrega */}
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1 flex items-center justify-between">
                          <span>Endereço de Entrega:</span>
                          {orderType === 'DELIVERY' && (
                            <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">
                              Necessário para Entrega
                            </span>
                          )}
                        </label>
                        <textarea
                          rows="2"
                          value={tempCustomerAddress}
                          onChange={(e) => setTempCustomerAddress(e.target.value)}
                          placeholder="Rua, Número, Bairro, Cidade, Complemento / Ponto de Referência..."
                          className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-emerald-600 focus:outline-none text-slate-800 resize-none"
                        />
                      </div>
                    </div>
                  </div>

                  {/* Actions Bar matching user prompt:
                      "se for somente o nome, não salvar na base ( uma compra rapida ), se conter todos os dados, cadastrar na base para futuras compras"
                  */}
                  <div className="pt-3 border-t border-slate-100 space-y-2.5">
                    {/* Live Status Indicator */}
                    <div className={"text-[11px] p-2.5 rounded-xl border flex items-center justify-between " + (
                      !(tempCustomerPhone.trim() || tempCustomerAddress.trim() || tempCustomerCpf.trim())
                        ? 'bg-amber-50/80 border-amber-200 text-amber-900'
                        : 'bg-emerald-50/80 border-emerald-200 text-emerald-900'
                    )}>
                      {!(tempCustomerPhone.trim() || tempCustomerAddress.trim() || tempCustomerCpf.trim()) ? (
                        <div className="flex items-center gap-1.5">
                          <span className="font-bold">⚡ Compra Rápida:</span>
                          <span className="text-[10px] text-amber-800">Somente nome preenchido · Não será salvo na base</span>
                        </div>
                      ) : (
                        <div className="flex items-center gap-1.5">
                          <span className="font-bold">💾 Cadastro Completo:</span>
                          <span className="text-[10px] text-emerald-800">Dados informados · Será cadastrado na base para futuras compras</span>
                        </div>
                      )}
                    </div>

                    {/* Primary Button: Adicionar Cliente */}
                    <button
                      type="button"
                      disabled={isSavingCustomer || !tempCustomerName.trim()}
                      onClick={handleAddCustomer}
                      className={"w-full py-2.5 px-4 rounded-xl text-xs font-bold text-white flex items-center justify-center gap-2 transition shadow-sm " + (
                        tempCustomerName.trim()
                          ? 'bg-[#109E46] hover:bg-[#0d853a] shadow-emerald-600/20 active:scale-98 cursor-pointer'
                          : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                      )}
                      title="Adiciona o cliente ao pedido"
                    >
                      <UserPlus className="w-4 h-4" />
                      <span>
                        {isSavingCustomer
                          ? 'Cadastrando na base...'
                          : (tempCustomerPhone.trim() || tempCustomerAddress.trim() || tempCustomerCpf.trim())
                          ? 'Adicionar Cliente (Cadastrar na Base)'
                          : 'Adicionar Cliente (Compra Rápida)'}
                      </span>
                    </button>

                    <div className="flex justify-between items-center text-[11px] text-slate-500 pt-1">
                      <button
                        type="button"
                        onClick={() => setActiveModal(null)}
                        className="hover:text-slate-800 font-medium"
                      >
                        Cancelar
                      </button>
                      {tempCustomerName.trim() && (tempCustomerPhone.trim() || tempCustomerAddress.trim()) && (
                        <button
                          type="button"
                          onClick={handleQuickPurchaseCustomer}
                          className="text-amber-700 hover:text-amber-800 font-medium"
                          title="Usar apenas nesta venda sem salvar no banco"
                        >
                          ⚡ Usar somente nesta venda (não salvar)
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL: PAGAR - F2 */}
              {activeModal === 'pay' && (
                <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                  <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                    <div>
                      <span className="text-[11px] font-bold uppercase tracking-wider text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full">
                        Fechamento de Caixa • F2
                      </span>
                      <h3 className="text-xl font-extrabold text-slate-900 mt-1">
                        Finalizar Pagamento
                      </h3>
                    </div>
                    <button
                      onClick={() => setActiveModal(null)}
                      className="p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100"
                    >
                      <X className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="my-4 p-4 rounded-2xl bg-[#0F381E] text-white flex items-center justify-between">
                    <div>
                      <span className="text-xs text-emerald-200 block">Total a receber</span>
                      <span className="text-2xl font-black">{formatBRL(finalTotal)}</span>
                    </div>
                    <div className="text-right text-xs text-emerald-100">
                      <p>{distinctItemsCount} itens ({totalUnitsCount} un.)</p>
                      <p className="font-bold text-emerald-300">{orderType === 'DELIVERY' ? '🛵 Entrega' : '🏪 Balcão'}</p>
                      {discountPercent > 0 && <p>Desc: -{discountPercent}%</p>}
                      {orderType === 'DELIVERY' && <p>Frete: {formatBRL(freightValue)}</p>}
                    </div>
                  </div>

                  {/* Customer display badge in pay modal */}
                  <div className="mb-4 p-2.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs">
                    <div className="min-w-0 flex-1">
                      <span className="text-[10px] uppercase font-bold text-slate-400 block">
                        Cliente • {orderType === 'DELIVERY' ? '🛵 Pedido para Entrega' : '🏪 Balcão'}
                      </span>
                      <span className="font-bold text-slate-800 truncate block">{customerName || 'Cliente Balcão'}</span>
                      {orderType === 'DELIVERY' && customerAddress && (
                        <span className="text-[11px] text-emerald-700 truncate block">📍 {customerAddress}</span>
                      )}
                    </div>
                    <button
                      onClick={() => openCustomerModal()}
                      className="text-xs font-bold text-emerald-700 hover:text-emerald-800 underline px-2 py-1"
                    >
                      Alterar
                    </button>
                  </div>

                  <p className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                    Forma de Pagamento
                  </p>
                  <div className="grid grid-cols-5 gap-1.5 mb-3">
                    {[
                      { id: 'pix', label: 'PIX Sicredi', icon: QrCode },
                      { id: 'debito', label: 'Débito', icon: CreditCard },
                      { id: 'credito', label: 'Crédito', icon: CreditCard },
                      { id: 'dinheiro', label: 'Dinheiro', icon: Banknote },
                      { id: 'fiado', label: 'Fiado', icon: User },
                    ].map((method) => {
                      const Icon = method.icon;
                      const active = paymentMethod === method.id;
                      return (
                        <button
                          key={method.id}
                          onClick={() => setPaymentMethod(method.id)}
                          className={"p-2 rounded-xl border text-[11px] font-bold flex flex-col items-center gap-1 transition " + (active
                            ? 'border-[#109E46] bg-emerald-50 text-[#0F381E] ring-2 ring-emerald-500/20'
                            : 'border-slate-200 text-slate-600 hover:bg-slate-50')}
                        >
                          <Icon className="w-4 h-4 text-emerald-700" />
                          <span className="truncate">{method.label}</span>
                        </button>
                      );
                    })}
                  </div>

                  {/* Vendedor e Caixa Responsáveis */}
                  <div className="grid grid-cols-2 gap-2 mb-3 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 uppercase">
                        Venda feita por (Vendedor):
                      </label>
                      <input
                        type="text"
                        value={sellerName}
                        onChange={(e) => setSellerName(e.target.value)}
                        placeholder="Nome do vendedor"
                        className="w-full mt-1 px-2.5 py-1 text-xs font-bold border border-slate-300 rounded-lg bg-white focus:outline-none focus:border-emerald-600"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 uppercase">
                        Recebido no Caixa por:
                      </label>
                      <input
                        type="text"
                        value={cashierName}
                        onChange={(e) => setCashierName(e.target.value)}
                        placeholder="Nome do operador de caixa"
                        className="w-full mt-1 px-2.5 py-1 text-xs font-bold border border-slate-300 rounded-lg bg-white focus:outline-none focus:border-emerald-600"
                      />
                    </div>
                  </div>

                  {paymentMethod === 'fiado' && (
                    <div className="p-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs font-medium mb-3">
                      ⚠️ <strong>Venda Fiada:</strong> O valor de {formatBRL(finalTotal)} será registrado no saldo devedor de <strong>{customerName}</strong>.
                    </div>
                  )}

                  {paymentMethod === 'pix' && (
                    <div className="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-medium mb-3">
                      💠 <strong>Pix Sicredi:</strong> QR Code e chave Pix Copia e Cola com o valor fixo travado de <strong>{formatBRL(finalTotal)}</strong>. Pedido baixado automaticamente quando pago!
                    </div>
                  )}

                  {paymentMethod === 'dinheiro' && (
                    <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 mb-4 space-y-2">
                      <div className="flex items-center justify-between">
                        <label className="text-xs font-semibold text-slate-600">
                          Valor recebido (R$):
                        </label>
                        <input
                          type="number"
                          placeholder={finalTotal.toFixed(2)}
                          value={cashReceived}
                          onChange={(e) => setCashReceived(e.target.value)}
                          className="w-32 px-3 py-1.5 rounded-xl border border-slate-300 text-right font-bold text-sm focus:outline-none focus:border-emerald-600 bg-white"
                        />
                      </div>
                      <div className="flex items-center justify-between text-xs pt-1 border-t border-slate-200">
                        <span className="font-semibold text-slate-500">Troco a devolver:</span>
                        <span className="text-base font-extrabold text-emerald-700">
                          {formatBRL(changeAmount)}
                        </span>
                      </div>
                    </div>
                  )}

                  <div className="flex items-center gap-2 pt-2">
                    <button
                      onClick={() => setActiveModal(null)}
                      className="w-1/3 py-3 rounded-xl border border-slate-200 font-bold text-xs text-slate-600 hover:bg-slate-50"
                    >
                      Voltar
                    </button>
                    <button
                      disabled={isSubmittingSale}
                      onClick={handleCompleteSale}
                      className="w-2/3 py-3 rounded-xl bg-[#109E46] hover:bg-[#0d853a] text-white font-bold text-sm flex items-center justify-center gap-2 shadow-md shadow-emerald-600/20 active:scale-98"
                    >
                      <Check className="w-4 h-4" />
                      <span>{isSubmittingSale ? 'Processando...' : 'Confirmar Venda'}</span>
                    </button>
                  </div>
                </div>
              )}

              {/* MODAL: DESCONTO - F3 */}
              {activeModal === 'discount' && (
                <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-xl">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-lg font-extrabold text-slate-900">
                      Aplicar Desconto (F3)
                    </h3>
                    <button
                      onClick={() => setActiveModal(null)}
                      className="p-1.5 text-slate-400 hover:text-slate-600 rounded-full"
                    >
                      <X className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="grid grid-cols-4 gap-2 mb-4">
                    {[0, 5, 10, 15].map((pct) => (
                      <button
                        key={pct}
                        onClick={() => setDiscountPercent(pct)}
                        className={"py-2.5 rounded-xl font-bold text-xs border transition " + (discountPercent === pct
                          ? 'bg-rose-500 text-white border-rose-500'
                          : 'border-slate-200 text-slate-700 hover:bg-slate-50')}
                      >
                        {pct}%
                      </button>
                    ))}
                  </div>

                  <label className="block text-xs font-semibold text-slate-500 mb-1">
                    Ou digite a porcentagem (%):
                  </label>
                  <input
                    type="number"
                    min="0"
                    max="100"
                    value={discountPercent}
                    onChange={(e) =>
                      setDiscountPercent(Math.min(100, Math.max(0, Number(e.target.value) || 0)))
                    }
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-300 font-bold text-slate-900 mb-4"
                  />

                  <button
                    onClick={() => setActiveModal(null)}
                    className="w-full py-3 rounded-xl bg-[#0F381E] text-white font-bold text-sm"
                  >
                    Confirmar Desconto
                  </button>
                </div>
              )}

              {/* MODAL: FRETE - F9 */}
              {activeModal === 'freight' && (
                <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-xl">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-lg font-extrabold text-slate-900">
                      Taxa de Entrega / Frete (F9)
                    </h3>
                    <button
                      onClick={() => setActiveModal(null)}
                      className="p-1.5 text-slate-400 hover:text-slate-600 rounded-full"
                    >
                      <X className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="grid grid-cols-4 gap-2 mb-4">
                    {[0, 5, 10, 15].map((val) => (
                      <button
                        key={val}
                        onClick={() => setFreightValue(val)}
                        className={"py-2.5 rounded-xl font-bold text-xs border transition " + (Number(freightValue) === val
                          ? 'bg-[#109E46] text-white border-[#109E46]'
                          : 'border-slate-200 text-slate-700 hover:bg-slate-50')}
                      >
                        {val === 0 ? 'Sem frete' : ('R$ ' + val)}
                      </button>
                    ))}
                  </div>

                  <label className="block text-xs font-semibold text-slate-500 mb-1">
                    Valor personalizado (R$):
                  </label>
                  <input
                    type="number"
                    min="0"
                    step="0.50"
                    value={freightValue}
                    onChange={(e) => setFreightValue(Math.max(0, Number(e.target.value) || 0))}
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-300 font-bold text-slate-900 mb-4"
                  />

                  <button
                    onClick={() => setActiveModal(null)}
                    className="w-full py-3 rounded-xl bg-[#0F381E] text-white font-bold text-sm"
                  >
                    Salvar Frete
                  </button>
                </div>
              )}

              {/* MODAL: SCANNER SIMULATOR */}
              {activeModal === 'scanner' && (
                <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-xl text-center">
                  <div className="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-700 flex items-center justify-center mx-auto mb-3">
                    <ScanBarcode className="w-7 h-7" />
                  </div>
                  <h3 className="text-lg font-extrabold text-slate-900">
                    Leitor de Código / Câmera
                  </h3>
                  <p className="text-xs text-slate-500 mt-1 mb-4">
                    Simule a leitura de um código de barras para testar a adição rápida ao caixa:
                  </p>

                  <div className="space-y-2 mb-4 text-left max-h-48 overflow-y-auto">
                    {products.slice(0, 5).map((p) => (
                      <button
                        key={p.id}
                        onClick={() => {
                          addToCart(p);
                          setActiveModal(null);
                        }}
                        className="w-full p-2.5 rounded-xl border border-slate-200 hover:border-emerald-600 hover:bg-emerald-50/40 flex items-center justify-between text-xs transition"
                      >
                        <div>
                          <span className="font-bold text-slate-800 block">{p.name}</span>
                          <span className="font-mono text-[10px] text-slate-400">
                            EAN: {p.sku}
                          </span>
                        </div>
                        <span className="font-bold text-emerald-700">{formatBRL(p.price)}</span>
                      </button>
                    ))}
                  </div>

                  <button
                    onClick={() => setActiveModal(null)}
                    className="w-full py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600"
                  >
                    Fechar Leitor
                  </button>
                </div>
              )}

              {/* MODAL: RECEIPT / VENDA CONCLUÍDA */}
              {activeModal === 'receipt' && (
                <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl text-center">
                  <div className="w-14 h-14 rounded-full bg-emerald-100 text-[#109E46] flex items-center justify-center mx-auto mb-3">
                    <Check className="w-7 h-7" />
                  </div>
                  <h3 className="text-xl font-black text-slate-900">Venda Realizada!</h3>
                  <p className="text-xs text-slate-500 mt-0.5">
                    COM FLORA • Comprovante de Venda
                  </p>

                  {/* Order Type & Customer Details */}
                  <div className="my-3 p-3 rounded-2xl bg-emerald-50/80 text-emerald-950 text-xs text-left space-y-1 border border-emerald-200/60">
                    <div className="flex items-center justify-between font-bold">
                      <span>{orderType === 'DELIVERY' ? '🛵 Pedido para Entrega' : '🏪 Venda Balcão / Retirada'}</span>
                      <span className="text-[10px] font-extrabold bg-white px-2 py-0.5 rounded-full text-emerald-800 shadow-2xs">
                        {orderType === 'DELIVERY' ? 'ENTREGA' : 'BALCÃO'}
                      </span>
                    </div>
                    <p className="font-bold text-slate-900 pt-0.5">Cliente: {customerName}</p>
                    {customerPhone && <p className="text-slate-600">📞 Contato: {customerPhone}</p>}
                    {orderType === 'DELIVERY' && customerAddress && (
                      <p className="text-emerald-900 font-medium">📍 {customerAddress}</p>
                    )}
                  </div>

                  <div className="my-3 p-3.5 rounded-2xl bg-slate-50 border border-dashed border-slate-300 text-left text-xs space-y-1.5">
                    {cart.map((item) => (
                      <div key={item.id} className="flex justify-between text-slate-700">
                        <span>
                          {item.quantity}x {item.name}
                        </span>
                        <span className="font-semibold">
                          {formatBRL(item.price * item.quantity)}
                        </span>
                      </div>
                    ))}
                    {discountPercent > 0 && (
                      <div className="flex justify-between text-rose-600 font-medium">
                        <span>Desconto ({discountPercent}%)</span>
                        <span>- {formatBRL(discountAmount)}</span>
                      </div>
                    )}
                    {orderType === 'DELIVERY' && Number(freightValue) > 0 && (
                      <div className="flex justify-between text-emerald-700 font-medium">
                        <span>Taxa de Entrega</span>
                        <span>+ {formatBRL(freightValue)}</span>
                      </div>
                    )}
                    <div className="border-t border-slate-200 pt-2 mt-2 flex justify-between font-bold text-sm text-slate-900">
                      <span>Total Pago ({paymentMethod.toUpperCase()})</span>
                      <span>{formatBRL(finalTotal)}</span>
                    </div>
                  </div>

                  <div className="flex gap-2">
                    <button
                      onClick={handleNewOrder}
                      className="flex-1 py-3 rounded-xl bg-[#109E46] hover:bg-[#0d853a] text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm"
                    >
                      <RotateCcw className="w-4 h-4" />
                      <span>Nova Venda</span>
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
